name: Quiet Watch source checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/QuietWatch.Checks -- .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 chess==1.11.2
      - run: python tests/check_weather_geometry.py
      - run: python tests/check_weather_atlas.py
      - run: python tests/check_blue_atlas.py
      - run: python tests/check_weather_eclipse.py
      - run: python tests/check_weather_relief.py
      - run: python tests/check_harbour_layout.py
      - run: python tests/check_cinematic_compositions.py
      - run: python tests/check_chess_terminal.py
